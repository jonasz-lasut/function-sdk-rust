[package]
name = "example-function"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "An example Crossplane composition function built with function-sdk-rust"

[dependencies]
function-sdk-rust = { path = "../sdk" }
tonic = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
